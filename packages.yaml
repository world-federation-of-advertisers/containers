      - https://snapshot-cloudflare.debian.org/archive/debian-security/20260429T185341Z
      - https://snapshot.debian.org/archive/debian-security/20260429T185341Z

archs:
  - amd64

packages:
  - base-files
  - netbase
  - ca-certificates
  - tzdata
  - zip
  - unzip
  - git
  - python3
  - python-is-python3
  - clang
  - swig
  - libclang-rt-dev
  - llvm